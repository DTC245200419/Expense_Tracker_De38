# Override bat HTTPS tu ky: chay scripts/tls.sh truoc de tao certs/server.crt va server.key
# docker compose -f compose.yaml -f compose.monitoring.yaml -f compose.logging.yaml -f compose.tls.yaml up -d
services:
  nginx:
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/logs/nginx

  app:
    environment:
      COOKIE_SECURE: "true"
