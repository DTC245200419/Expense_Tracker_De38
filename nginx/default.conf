# Giai doan 1-3: HTTP tai cong 8080 (host: 127.0.0.1:8080)
upstream app_upstream {
  server app:3000;
  keepalive 16;
}

server {
  listen      8080;
  server_name localhost;

  include /etc/nginx/snippets/headers.conf;

  location / {
    include /etc/nginx/snippets/proxy.conf;
  }
}

# stub_status cho nginx-prometheus-exporter, chi trong mang Docker (khong publish ra host)
server {
  listen     8082;
  access_log off;

  location /stub_status {
    stub_status;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;
  }
}
