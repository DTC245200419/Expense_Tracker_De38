# Cau hinh Nginx cho image nginxinc/nginx-unprivileged (chay UID 101, khong root)
worker_processes auto;
error_log /logs/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Thu muc tam ghi duoc khi root filesystem chi doc
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Access log dang JSON de Promtail/Loki parse
  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"path":"$uri",'
      '"query":"$args",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"scheme":"$scheme"'
    '}';
  access_log /logs/nginx/access.log json_combined;

  # Hardening co ban
  server_tokens        off;
  client_max_body_size 16k;
  client_body_timeout  10s;
  client_header_timeout 10s;
  sendfile             on;
  tcp_nopush           on;
  keepalive_timeout    65;
  gzip                 on;
  gzip_types           text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
